services:
  habit_tracker:
    image: alexwinterfish/habit_tracker:latest
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate && python manage.py collectstatic --noinput  && gunicorn config.wsgi:application --bind 0.0.0.0:8000 && python manage.py set_schedule  && celery -A config worker -l INFO && celery -A config beat -l INFO -S django"
    volumes:
      - staticfiles:/app/staticfiles
      - static_volume:/app/static
    expose:
      - "8000"
    depends_on:
      [db, redis]
    networks:
      app_network:
  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app_network:
  nginx:
    image: alexwinterfish/nginx-custom:latest
    ports:
      - "80:80"
    depends_on:
      - habit_tracker
    volumes:
      - staticfiles:/app/staticfiles
      - static_volume:/app/static
    networks:
      app_network:

  db:
    image: postgres
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      app_network:
    volumes:
      - postgres_data:/var/lib/postgresql/data/
networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  staticfiles:
  nginx: